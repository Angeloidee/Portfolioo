<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <rect width="800" height="420" fill="#1a1917"/>

  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="0.8" fill="#333"/>
  </pattern>
  <rect width="800" height="420" fill="url(#dots)"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" fill="#555" letter-spacing="0.12em">WILKINSON POWER DIVIDER · 2.4 GHz · Z₀ = 50 Ω</text>

  <!-- PORT 1 (left) -->
  <line x1="60" y1="210" x2="140" y2="210" stroke="#9b9890" stroke-width="2"/>
  <rect x="20" y="190" width="40" height="40" rx="4" fill="none" stroke="#9b9890" stroke-width="1.5"/>
  <text x="40" y="208" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" fill="#9b9890">50</text>
  <text x="40" y="222" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" fill="#9b9890">Ω</text>
  <text x="40" y="247" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#555" letter-spacing="0.06em">PORT 1</text>
  <line x1="40" y1="230" x2="40" y2="240" stroke="#555" stroke-width="1"/>

  <!-- Input line -->
  <line x1="140" y1="210" x2="200" y2="210" stroke="#e2e0dc" stroke-width="2.5"/>

  <!-- Split point -->
  <circle cx="200" cy="210" r="4" fill="#e2e0dc"/>

  <!-- Upper branch line to transformer -->
  <line x1="200" y1="210" x2="200" y2="140" stroke="#e2e0dc" stroke-width="2.5"/>
  <line x1="200" y1="140" x2="280" y2="140" stroke="#e2e0dc" stroke-width="2.5"/>

  <!-- Lower branch line to transformer -->
  <line x1="200" y1="210" x2="200" y2="280" stroke="#e2e0dc" stroke-width="2.5"/>
  <line x1="200" y1="280" x2="280" y2="280" stroke="#e2e0dc" stroke-width="2.5"/>

  <!-- Upper λ/4 transformer (70.71 Ω) -->
  <rect x="280" y="118" width="160" height="44" rx="4" fill="#2a2825" stroke="#378ADD" stroke-width="1.5"/>
  <text x="360" y="137" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" fill="#85B7EB">Z₀ = 70.71 Ω</text>
  <text x="360" y="153" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#378ADD">λ/4 · 2.4 GHz</text>

  <!-- Lower λ/4 transformer (70.71 Ω) -->
  <rect x="280" y="258" width="160" height="44" rx="4" fill="#2a2825" stroke="#378ADD" stroke-width="1.5"/>
  <text x="360" y="277" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" fill="#85B7EB">Z₀ = 70.71 Ω</text>
  <text x="360" y="293" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#378ADD">λ/4 · 2.4 GHz</text>

  <!-- Upper transformer to junction -->
  <line x1="440" y1="140" x2="520" y2="140" stroke="#e2e0dc" stroke-width="2.5"/>

  <!-- Lower transformer to junction -->
  <line x1="440" y1="280" x2="520" y2="280" stroke="#e2e0dc" stroke-width="2.5"/>

  <!-- Isolation resistor (100 Ω) vertical -->
  <line x1="520" y1="140" x2="520" y2="190" stroke="#e2e0dc" stroke-width="2.5"/>
  <rect x="502" y="190" width="36" height="40" rx="4" fill="#2a2825" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="520" y="207" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" fill="#FAC775">100</text>
  <text x="520" y="221" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" fill="#EF9F27">Ω</text>
  <line x1="520" y1="230" x2="520" y2="280" stroke="#e2e0dc" stroke-width="2.5"/>

  <!-- Upper output line -->
  <line x1="520" y1="140" x2="600" y2="140" stroke="#e2e0dc" stroke-width="2.5"/>
  <!-- Upper output matching line -->
  <rect x="600" y="118" width="80" height="44" rx="4" fill="#2a2825" stroke="#9b9890" stroke-width="1"/>
  <text x="640" y="137" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#9b9890">50 Ω</text>
  <text x="640" y="152" text-anchor="middle" font-family="'DM Mono', monospace" font-size="9" fill="#555">λ/4</text>
  <line x1="680" y1="140" x2="740" y2="140" stroke="#e2e0dc" stroke-width="2.5"/>

  <!-- Lower output line -->
  <line x1="520" y1="280" x2="600" y2="280" stroke="#e2e0dc" stroke-width="2.5"/>
  <!-- Lower output matching line -->
  <rect x="600" y="258" width="80" height="44" rx="4" fill="#2a2825" stroke="#9b9890" stroke-width="1"/>
  <text x="640" y="277" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#9b9890">50 Ω</text>
  <text x="640" y="292" text-anchor="middle" font-family="'DM Mono', monospace" font-size="9" fill="#555">λ/4</text>
  <line x1="680" y1="280" x2="740" y2="280" stroke="#e2e0dc" stroke-width="2.5"/>

  <!-- PORT 2 (top right) -->
  <rect x="740" y="120" width="40" height="40" rx="4" fill="none" stroke="#9b9890" stroke-width="1.5"/>
  <text x="760" y="138" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" fill="#9b9890">50</text>
  <text x="760" y="152" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" fill="#9b9890">Ω</text>
  <text x="760" y="108" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#555" letter-spacing="0.06em">PORT 2</text>

  <!-- PORT 3 (bottom right) -->
  <rect x="740" y="260" width="40" height="40" rx="4" fill="none" stroke="#9b9890" stroke-width="1.5"/>
  <text x="760" y="278" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" fill="#9b9890">50</text>
  <text x="760" y="292" text-anchor="middle" font-family="'DM Mono', monospace" font-size="11" fill="#9b9890">Ω</text>
  <text x="760" y="315" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#555" letter-spacing="0.06em">PORT 3</text>

  <!-- Junction dots -->
  <circle cx="520" cy="140" r="4" fill="#e2e0dc"/>
  <circle cx="520" cy="280" r="4" fill="#e2e0dc"/>

  <!-- Labels -->
  <text x="360" y="100" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#378ADD" letter-spacing="0.08em">UPPER ARM</text>
  <text x="360" y="320" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#378ADD" letter-spacing="0.08em">LOWER ARM</text>
  <text x="547" y="213" text-anchor="start" font-family="'DM Mono', monospace" font-size="10" fill="#EF9F27" letter-spacing="0.06em">ISOLATION</text>

  <!-- S-param results bar -->
  <line x1="60" y1="370" x2="740" y2="370" stroke="#333" stroke-width="0.5"/>
  <text x="160" y="393" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#555" letter-spacing="0.06em">S11 @ 2.404 GHz</text>
  <text x="160" y="408" text-anchor="middle" font-family="'DM Mono', monospace" font-size="13" fill="#9b9890">−49.3 dB</text>
  <line x1="320" y1="375" x2="320" y2="415" stroke="#333" stroke-width="0.5"/>
  <text x="400" y="393" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#555" letter-spacing="0.06em">S21 = S31</text>
  <text x="400" y="408" text-anchor="middle" font-family="'DM Mono', monospace" font-size="13" fill="#9b9890">−3.0 dB</text>
  <line x1="480" y1="375" x2="480" y2="415" stroke="#333" stroke-width="0.5"/>
  <text x="610" y="393" text-anchor="middle" font-family="'DM Mono', monospace" font-size="10" fill="#555" letter-spacing="0.06em">Tool</text>
  <text x="610" y="408" text-anchor="middle" font-family="'DM Mono', monospace" font-size="13" fill="#9b9890">RFSim99</text>
</svg>
